name: Despliegue directo a GitHub Pages

on:
  push:
    branches:
      - main # Si tu rama principal se llama 'master', cambia esto por 'master'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos HTML5
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Sube todos los archivos desde la raíz del proyecto

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
